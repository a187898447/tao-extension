# Taobao page element selectors
# Update these if Taobao's UI changes

# Product detail page
product:
  buy_now: "#J_LinkBuy, a[title='立即购买'], .tb-btn-buy a, .J_LinkBuy"
  sku_option: ".tb-sku li, .J_TSaleProp li[data-value], .sku-line .sku-item"

# Shopping cart page
cart:
  select_all: "#J_SelectAll2, .select-all input, .cart-checkbox .all-check, input[name='selectAll']"
  checkout_btn: "#J_Go, .go-btn, a[title='结算'], .settlement-btn, .checkout-btn, button:has-text('结算')"

# Checkout/order confirmation page
checkout:
  submit_order: "#J_Go, .go-btn a, a[id*='submit'], button:has-text('提交订单')"

# Terminal blocking indicators (text to detect)
blocking:
  terminal:
    sold_out:
      - "已售罄"
      - "卖完了"
      - "库存不足"
      - "已抢光"
      - "该商品已售完"
    delisted:
      - "商品已下架"
      - "不存在"
      - "已失效"

# Store search (for scheduled listing type products)
store:
  search_input: "input[type='text'], input[type='search'], input[name='q'], input[name='keyword'], .search-input input, #q, #keyword, .ks-search-input, .shop-search input, input[placeholder*='搜索']"
  search_btn: "button:has-text('搜索'), .search-btn, button[type='submit'], input[type='submit'], .search-btn-wrap button, [class*='search'] button, .ks-search-btn, form button, form input[type='submit']"
  search_results: ".search-results, .goods-list, .item-list, .J_ItemList, [data-spm='search'] ul, .ks-search-results, .shop-search-results, .J_SearchResult"
  result_item: ".item, .goods-item, .J_Item, .ks-item, li[data-id], .item-wrap, [data-spm='search'] li, .shop-search-results li, .goods-list > *"
  result_price: ".price, .c-price, .ks-price, .item-price, strong, em, [class*='price']"

# Success indicators
success:
  url_patterns:
    - "trade.taobao.com"
    - "alipay.com"
  text_patterns:
    - "订单提交成功"
    - "付款成功"
    - "感谢购买"
